; EDF6 Generator Body Budget 0.2.0
; 1 = force this feature on in every mission; 0 = respect original mission settings.
; Missing INI, missing keys or invalid values default to 1.
; Restart the game after changing this file.
[Optimization]
FullLightWeightMode=1
AcceptGeneratorObjects=1

; 1 = small local status log beside this DLL; 0 = no plugin log is opened or written.
; An existing log is kept when logging is switched off.
[Logging]
Enabled=1
