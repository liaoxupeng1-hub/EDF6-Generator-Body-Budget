; Restart EDF6 after changes. Missing switches default to enabled.
[Optimization]
FullLightWeightMode=1
AcceptGeneratorObjects=1

; Shared budget for original ant and E619 squid egg shell groups.
; MaxShellGroups: 0-1024. 0 skips all target shell groups; default 32.
[EggShells]
Enabled=1
MaxShellGroups=32

[Logging]
Enabled=1
